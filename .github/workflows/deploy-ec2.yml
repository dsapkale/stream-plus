on:
    push:
        branches:
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USER }}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: docker build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: dsapkale/stream-plus:latest
            - name: deploy to ec2
              uses: appleboy/ssh-action@v1.2.5
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_KEY }}
                port: 22
                script: |
                    sudo docker rm -f stream-plus || true
                    sudo docker run -d --name stream-plus -p 80:80 dsapkale/stream-plus