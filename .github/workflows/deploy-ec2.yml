on:
    push:
        paths: 
            - index.html
        branches:
            - main
    workflow_dispatch:
        inputs:
            tag:
                description: "docker tag image"
                required: true
                default: "latest"
jobs:
    build:
        runs-on: ubuntu-latest
        env: 
          DOCKER_USERNAME: ${{ secrets.DOCKER_USER }}
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{env.DOCKER_USERNAME}}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: docker build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: ${{env.DOCKER_USERNAME}}/stream-plus:latest
    
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: deploy to ec2
              uses: appleboy/ssh-action@v1.2.5
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_KEY }}
                port: 22
                script: |
                    sudo docker rm -f stream-plus || true
                    sudo docker run -d --name stream-plus -p 80:80 dsapkale/stream-plus